<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            background-color: #333;
            font-family: sans-serif;
            padding: 20px;
        }

        form {
            width: 300px;
            margin: auto; /* Center the form */
        }

        label {
            color: #fff;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #fff;
            color: #fff;
            padding: 8px 0;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-bottom-color: #5cacec;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .forgot-password {
            color: #ccc;
            display: block;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <form>
        <label for="username">Username</label>
        <input type="text" id="username">
        
        <label for="password">Password</label>
        <input type="password" id="password">
        
        <button type="submit">Sign In</button>
        <a href="#" class="forgot-password">Forgot Password?</a>
        <button type="button">Sign in with third-party account</button>
    </form>

</body>
</html>
